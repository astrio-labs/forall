[package]
edition.workspace = true
license.workspace = true
name = "forall-memories-extension"
version.workspace = true

[lib]
name = "forall_memories_extension"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
forall-core = { workspace = true }
forall-extension-api = { workspace = true }
forall-features = { workspace = true }
forall-otel = { workspace = true }
forall-tools = { workspace = true }
forall-utils-absolute-path = { workspace = true }
forall-utils-output-truncation = { workspace = true }
forall-utils-template = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs"] }

[dev-dependencies]
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["fs", "macros"] }
