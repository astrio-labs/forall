[package]
edition.workspace = true
license.workspace = true
name = "forall-models-manager"
version.workspace = true

[lib]
doctest = false
name = "forall_models_manager"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
chrono = { workspace = true, features = ["serde"] }
forall-app-server-protocol = { workspace = true }
forall-collaboration-mode-templates = { workspace = true }
forall-login = { workspace = true }
forall-model-provider-info = { workspace = true }
forall-otel = { workspace = true }
forall-protocol = { workspace = true }
forall-utils-output-truncation = { workspace = true }
forall-utils-template = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["fs", "sync", "time"] }
tracing = { workspace = true, features = ["log"] }

[dev-dependencies]
pretty_assertions = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
