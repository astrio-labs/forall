<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>GitHub connected to Forall</title>
    <link rel="icon" href='data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none"%3E%3Cpath stroke="%234BA6DB" stroke-width="2.8" stroke-linecap="round" d="M4.5 4 16 28M27.5 4 16 28M9.4 14h13.2"/%3E%3C/svg%3E' type="image/svg+xml" />
    <style>
      :root {
        --bg: #ffffff;
        --text: #000000;
        --text-secondary: #525252;
        --accent: #4ba6db;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #262624;
          --text: #eceae4;
          --text-secondary: #a8a49b;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg);
        color: var(--text);
        font-family: "Source Sans 3", "Source Sans Pro", system-ui, -apple-system,
          "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding: 48px 24px;
        animation: enter 0.45s ease-out both;
      }
      @keyframes enter {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        main {
          animation: none;
        }
      }
      .mark {
        margin-bottom: 28px;
      }
      .mark .bar {
        stroke: var(--accent);
      }
      h1 {
        margin: 0 0 10px;
        font-size: 22px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0;
        font-size: 15px;
        line-height: 1.5;
        color: var(--text-secondary);
      }
    </style>
  </head>
  <body>
    <main>
      <svg class="mark" width="44" height="44" viewBox="0 0 32 32" fill="none" aria-hidden="true">
        <path stroke="currentColor" stroke-width="2.8" stroke-linecap="round" d="M4.5 4 16 28M27.5 4 16 28" />
        <path class="bar" stroke-width="2.8" stroke-linecap="round" d="M9.4 14h13.2" />
      </svg>
      <h1>GitHub is connected to Forall</h1>
      <p>You&rsquo;re all set. You can close this tab and pick up where you left off.</p>
    </main>
  </body>
</html>
